name: release

# Cut a real GitHub Release when a version tag is pushed (e.g. `git tag v0.3.0 &&
# git push origin v0.3.0`). Builds the embedded frontend once, cross-compiles a
# static binary per platform with the tag stamped in, and publishes them plus a
# checksum file and the installer. `lasso update` and install.sh consume these.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release + upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      # The committed lassoSemver and the pushed tag must agree, so the binary's
      # stamped version equals the release the CLI compares against.
      - name: Verify tag matches lassoSemver
        run: |
          version="${GITHUB_REF_NAME#v}"
          committed=$(grep -oP 'lassoSemver = "\K[0-9]+\.[0-9]+\.[0-9]+' src/version.go)
          if [ "$version" != "$committed" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != lassoSemver ${committed} in src/version.go — run 'mise run bump' and retag" >&2
            exit 1
          fi

      - name: Build frontend (embedded into the binary)
        working-directory: src/web
        run: bun install --frozen-lockfile && bun run build

      - name: Stage the embedded MCP skill (SKILL.md + docs)
        run: ./scripts/stage-skill.sh

      - name: Cross-compile release binaries
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/lasso-${os}-${arch}"
            echo "building ${out}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
              go build -C src -trimpath -ldflags "-s -w -X main.lassoSemver=${version}" -o "../${out}" .
          done
          ( cd dist && sha256sum lasso-* > checksums.txt )
          cp install.sh dist/install.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lasso-*
            dist/checksums.txt
            dist/install.sh
          generate_release_notes: true

  # LassoDesktop, the Mac app, ships with every lasso release at the same
  # version: built, Developer ID signed and notarized on minime (a self-hosted
  # runner in its logged-in session), then attached to this release with its
  # Sparkle appcast. The app's feed is .../releases/latest/download/appcast.xml.
  # Secrets come from fnox on minime, never from GitHub (mac/Scripts/release.sh).
  desktop:
    needs: release
    runs-on: [self-hosted, macOS, minime, lasso-desktop]
    steps:
      - uses: actions/checkout@v4

      - name: Build, sign and notarize LassoDesktop
        working-directory: mac
        run: ./Scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Attach the DMG and appcast to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" mac/dist/LassoDesktop-*.dmg mac/dist/appcast.xml --clobber
