name: release

# Cut a real GitHub Release when a version tag is pushed (e.g. `git tag v0.3.0 &&
# git push origin v0.3.0`). Builds the embedded frontend once, cross-compiles a
# static binary per platform with the tag stamped in, and publishes them plus a
# checksum file and the installer. `lasso update` and install.sh consume these.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release + upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      # The committed lassoSemver and the pushed tag must agree, so the binary's
      # stamped version equals the release the CLI compares against.
      - name: Verify tag matches lassoSemver
        run: |
          version="${GITHUB_REF_NAME#v}"
          committed=$(grep -oP 'lassoSemver = "\K[0-9]+\.[0-9]+\.[0-9]+' src/version.go)
          if [ "$version" != "$committed" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != lassoSemver ${committed} in src/version.go — run 'mise run bump' and retag" >&2
            exit 1
          fi

      - name: Build frontend (embedded into the binary)
        working-directory: src/web
        run: bun install --frozen-lockfile && bun run build

      - name: Stage the embedded MCP skill (SKILL.md + docs)
        run: ./scripts/stage-skill.sh

      - name: Cross-compile release binaries
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/lasso-${os}-${arch}"
            echo "building ${out}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
              go build -C src -trimpath -ldflags "-s -w -X main.lassoSemver=${version}" -o "../${out}" .
          done
          ( cd dist && sha256sum lasso-* > checksums.txt )
          cp install.sh dist/install.sh

      # Every installed Mac app reads releases/latest/download/appcast.xml, and
      # the Mac app is built and attached later, from titan (publish.sh). Until
      # then, or if that never happens, this release would be the newest one
      # with no appcast and every Mac's update check would 404. So it starts
      # with the newest earlier release's appcast and Lasso.dmg: the appcast
      # names its own release's versioned DMG, so Macs keep seeing the last
      # published app, and publish.sh replaces both (--clobber). Skipped when
      # this release already has an appcast (a re-run after publish.sh), so a
      # re-run never overwrites the real one with an older one.
      - name: Carry the Mac app's appcast forward
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          has() { gh release view "$1" --json assets -q '.assets[].name' 2>/dev/null | grep -qx appcast.xml; }
          if has "$GITHUB_REF_NAME"; then echo "this release has its appcast"; exit 0; fi
          prev=""
          for tag in $(gh release list --exclude-drafts --exclude-pre-releases -L 30 --json tagName -q '.[].tagName'); do
            [ "$tag" = "$GITHUB_REF_NAME" ] && continue
            if has "$tag"; then prev="$tag"; break; fi
          done
          if [ -z "$prev" ]; then echo "::warning::no earlier release has a Mac appcast"; exit 0; fi
          echo "carrying the Mac app forward from $prev"
          mkdir -p dist/mac
          gh release download "$prev" -p appcast.xml -p Lasso.dmg -D dist/mac

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lasso-*
            dist/checksums.txt
            dist/install.sh
            dist/mac/*
          generate_release_notes: true
