# Overlay for `mise run dev` (scripts/container-dev-web.sh): the Vite command a
# foreground `isb up` runs, and the two proxy devices wiring Vite in the
# container to the Go backend on the host. They are point-to-point TCP forwards
# for one port each, so the container keeps its own network namespace (no
# `--network host`).
services:
  web:
    # Run by the foreground `isb up` in container-dev-web.sh, as dev.yaml's
    # user in its working_dir (dev, src/web) with the mise PATH. Inside the
    # container Vite is always on 5173; LASSO_BACKEND is the `backend` device
    # below. `-d` ignores it, so the other tasks' `up -d` never start a Vite.
    command:
      - env
      - LASSO_BACKEND=http://127.0.0.1:8190
      - bun
      - run
      - dev
      - --host
      - 127.0.0.1
      - --port
      - "5173"
      - --strictPort
    ports:
      # container 127.0.0.1:8190 -> host 127.0.0.1:<backend port>. The backend
      # stays on host loopback and is never exposed on the incus bridge, yet
      # Vite's proxy still reaches /api and the ttyd websockets.
      - name: backend
        bind: guest
        listen: tcp:127.0.0.1:8190
        connect: "tcp:127.0.0.1:${LASSO_BACKEND_PORT:?set by container-dev-web.sh}"
      # host 127.0.0.1:<first free port of 5173-5223> -> container
      # 127.0.0.1:5173. Loopback on both sides: the tailnet reaches it only
      # through `tailscale serve`'s HTTPS listener (container-dev-web.sh), so
      # plain HTTP is never published. The host side gives way (the published
      # range), the guest side is always 5173.
      - name: vite
        host_ip: 127.0.0.1
        published: 5173-5223
        target: 5173
